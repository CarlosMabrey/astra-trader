[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astra-trader"
version = "0.1.0"
description = "Autonomous quantitative research and paper-trading engine"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "duckdb>=1.1", "huggingface_hub>=0.34"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
